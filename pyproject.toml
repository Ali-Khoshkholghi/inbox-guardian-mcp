[project]
name = "inbox-guardian"
version = "0.1.0"
description = "MCP-native customer support triage pipeline (portfolio project, built step by step)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.140.0",
    "authlib>=1.3.2",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
